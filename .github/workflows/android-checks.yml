name: Android source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Transactional importer checks (synthetic data)
        run: |
          mkdir -p /tmp/gow2-java
          javac -d /tmp/gow2-java android/app/src/main/java/io/github/genissonemilio/gow2/DiscImporter.java tests/android/DiscImporterTest.java
          java -cp /tmp/gow2-java io.github.genissonemilio.gow2.DiscImporterTest
      - name: Disc import regression checks (no game data)
        run: python3 -m unittest discover -s tests/linux -v
      - name: Render state ignores C++ padding
        run: |
          c++ -std=c++20 -I PS2Recomp/ps2xRuntime/include tests/android/state_compare_probe.cpp -o /tmp/gow2-state-probe
          /tmp/gow2-state-probe
      - name: Python syntax
        run: python3 -m compileall -q tools/android
      - name: VU MAC flags against raw-bit oracle (SSE fallback)
        run: |
          c++ -std=c++20 -O3 -msse4.1 -ffp-contract=off -I PS2Recomp/ps2xRuntime/include tests/android/vu_mac_probe.cpp -o /tmp/gow2-vu-mac
          /tmp/gow2-vu-mac
      - name: Conservative triangle culling against polygon clipping
        run: |
          c++ -std=c++20 -O2 -I PS2Recomp/ps2xRuntime/include tests/android/triangle_cull_probe.cpp -o /tmp/gow2-triangle-cull
          /tmp/gow2-triangle-cull
      - name: IOP cycle grants and game frame pacing
        run: |
          c++ -std=c++20 -O2 -I PS2Recomp/ps2xIOP/include tests/android/iop_clock_probe.cpp -o /tmp/gow2-iop-clock
          /tmp/gow2-iop-clock
          c++ -std=c++20 -O2 -I native tests/android/frame_clock_probe.cpp -o /tmp/gow2-frame-clock
          /tmp/gow2-frame-clock
      - name: GS rows match scalar pixel operations
        run: |
          c++ -std=c++20 -O2 -w -I PS2Recomp/ps2xRuntime/include tests/android/gs_memory_probe.cpp PS2Recomp/ps2xRuntime/src/lib/gs/ps2_gs_memory.cpp -o /tmp/gow2-gs-memory
          /tmp/gow2-gs-memory
      - name: GIF arbitration and buffer lifetime
        run: |
          c++ -std=c++20 -O2 -I PS2Recomp/ps2xRuntime/include tests/android/gif_arbiter_probe.cpp PS2Recomp/ps2xRuntime/src/lib/gs/ps2_gif_arbiter.cpp -o /tmp/gow2-gif-arbiter
          /tmp/gow2-gif-arbiter
      - name: CLUT load and comparison banks
        run: |
          c++ -std=c++20 -O2 -w -I PS2Recomp/ps2xRuntime/include -I PS2Recomp/ps2xRuntime/src/lib/gs/gpu tests/android/texture_store_probe.cpp PS2Recomp/ps2xRuntime/src/lib/gs/gpu/gs_texture_store.cpp PS2Recomp/ps2xRuntime/src/lib/gs/ps2_gs_memory.cpp -o /tmp/gow2-texture-store
          /tmp/gow2-texture-store
