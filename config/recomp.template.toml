# Configuración de PS2Recomp para God of War II (SCUS_974.81 v1.01, SHA1 E6A62A0F3E781C29513F563F4625B9B3A9103C56).
# Modelo: referencia/gow1/config/recomp.template.toml. Las direcciones son de GoW II: las de GoW1 no valen aquí.
# recompile.ps1 rellena @ELF@, @MAP@ y @OUT@.

[general]
input = "@ELF@"
ghidra_output = "@MAP@"
output = "@OUT@"
single_file_output = false

# Como en GoW1: las syscalls se tratan por instrucción, no parcheando los envoltorios
patch_syscalls = false
patch_cop0 = true
patch_cache = true

# Funciones con manejador propio en el runtime. Solo direcciones verificadas en el ELF de GoW II;
# las de GoW1 que faltan se van localizando (ver docs/NOTES.md, "Stubs de librerías de Sony").
stubs = [
  "StartThread@0x002D0768",     # SDK 3.0: función en C (ReferThreadStatus + syscall 0x22 en 0x2CF740), como en GoW1
  "iWakeupThread@0x002CF860",   # syscall -0x34
  "InitTLB@0x002CFD90",         # syscall 0x82
]

# Funciones del juego a las que solo se llega por puntero (vtables, callbacks) o que Ghidra no analizó.
# Salen de: py -3 tools/scan_missing_functions.py --csv config/funcmap.csv
